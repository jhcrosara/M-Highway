      const nearest=sameLane.length?Math.min(...sameLane.map(c=>c.y)):Infinity;
      const y=Math.min(spawnY,nearest-carH*2.65);
      cars.push({uid:++trafficId,lane:n,y,color:colors[Math.floor(Math.random()*colors.length)],s:.88+Math.random()*.08,pace,actualPace:pace,awarded:false,minClearance:Infinity,moves:[]});
    }
    openLane=free;waveCount++;
    // At higher scores traffic is denser, but gaps scale with actual
    // road speed and car size so the player has time to steer safely.
    const travelSpeed=(speed+45)*2.15*1.22;
    const carHeight=Math.min(laneW*.51,58)*1.65;
    // Keep enough time between rows to steer into the open corridor.
    // Density increases with both score and survival time, with a safety floor.
    const safeGap=(carHeight*3.9)/travelSpeed+.58;
    spawn=Math.max(safeGap,1.48-level*.033)+Math.random()*.22;
    if(blocked===2 && free!==lastPattern)spawn+=.18;
    lastPattern=free;
    // Two-lane shifts need more room; keep the next row reachable.
    if(blocked===2 && Math.abs(free-lane)===2)spawn+=.24;
  }
  // Traffic keeps moving: match the speed of a slower car ahead smoothly,
  // with a strict positive speed floor. No position snapping or hard stops.
  const minFollowing=carH*2.05;
  for(let n=0;n<3;n++){
    const line=cars.filter(c=>c.lane===n).sort((a,b)=>b.y-a.y);
    for(let i=0;i<line.length;i++){
      const c=line[i],ahead=line[i-1];
      let target=c.pace;
      if(ahead){
        const gap=ahead.y-c.y;
        const aheadPace=ahead.actualPace||ahead.pace;
        if(gap<minFollowing*3.0)target=Math.min(target,aheadPace);
        // Ease into the lead vehicle's pace without ever bringing traffic to a halt.
        if(gap<minFollowing*1.65)target=Math.min(target,Math.max(.76,aheadPace*.98));
        // Prevent closing on a vehicle while maintaining visible motion.
        if(gap<minFollowing*1.3)target=Math.min(target,Math.max(.76,aheadPace*.97));
      }
      c.actualPace+=(Math.max(.76,target)-c.actualPace)*Math.min(1,dt*2.4);
      c.actualPace=Math.max(.76,c.actualPace);
    }
  }
  for(const c of cars){
    const prevY=c.y;
    c.y+=(speed+45)*dt*2.15*c.actualPace;
    const dx=Math.abs(center(c.lane)-px);
    // Actual overlapping rectangles, with a small forgiveness margin.
    const collisionX=laneW*.48;
    const collisionY=carH*.85;
    if(Math.abs(c.y-playerY)<collisionY){
      if(dx<collisionX){crash();break}
      // Clearance is measured between the actual car bodies, not lane centers.
      c.minClearance=Math.min(c.minClearance,dx-collisionX);
    }
    // Only a successful overtake counts, not simply changing lanes.
    if(!c.awarded&&prevY<=playerY+carH&&c.y>playerY+carH){award(c)}
  }
  // Collision pass after ALL traffic has moved. Police can weave around
  // traffic, but committing to a cut with insufficient clearance can wreck
  // them. Test actual sprite rectangles, not merely lane-center equality.
  for(const cop of cops){
    if(cop.state!=='chase' || cop.life<1.6)continue;
    const copWidth=laneW*.51*.94;
    const copHeight=carH*.94;
    const hit=cars.find(c=>{
      const trafficWidth=laneW*.51*c.s;
      const trafficHeight=carH*c.s;
      return Math.abs(cop.x-center(c.lane))<(copWidth+trafficWidth)*.43 &&
        Math.abs(cop.y-c.y)<(copHeight+trafficHeight)*.43;
    });
    if(hit){
      // Contact is decisive; a crash no longer requires 0.24 seconds of
      // overlap, which allowed traffic to pass through the police car.
      cop.state='wrecked';cop.crashY=cop.y;explosion(cop.x,cop.y,true);addPoliceCrashBonus(cop.x,cop.y);
      cop.y=cop.crashY;
      patrolCooldown=Math.max(patrolCooldown,8+Math.random()*6);
      nextCop=Math.max(nextCop,5+Math.random()*5);
    }
  }
  cops=cops.filter(c=>c.state!=='wrecked' || c.life<0); // explosion remains visible in effects
  cars=cars.filter(c=>c.y<H+125);
  for(const p of popups){p.life-=dt;p.y-=dt*37}
  popups=popups.filter(p=>p.life>0);
  $('pursuitLabel').textContent=cops.some(c=>c.state==='chase'||c.state==='approach')?'PURSUIT: '+cops.filter(c=>c.state==='chase'||c.state==='approach').length+' UNIT(S)':'PURSUIT: CLEAR';
  $('speed').textContent=String(Math.floor(speed)).padStart(3,'0');const frac=Math.max(0,Math.min(1,speed/160));$('dialProgress').style.strokeDasharray=(frac*75)+' 100';
}
function drawPopups(){
  ctx.save();ctx.textAlign='left';
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.life*2.1);
    const x=Math.max(8,Math.min(W-52,p.x));
    ctx.font='bold 13px monospace';
    ctx.fillStyle=p.color;ctx.fillText(typeof p.pts==='number'?'+'+p.pts:p.pts,x,p.y);

  }
  ctx.restore();
}
function loop(now){let dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);scene();drawPopups();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
