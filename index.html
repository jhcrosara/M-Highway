<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M Highway</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}button{font:inherit;color:inherit;cursor:pointer}.app{height:100vh;height:100dvh;display:flex;flex-direction:column}.topbar{height:58px;min-height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;background:linear-gradient(#18191d,#08090b);border-bottom:2px solid #54565a;position:relative;z-index:3}.topbar:after{content:"";position:absolute;bottom:-2px;left:76px;width:210px;height:3px;background:#d92735}.brand{display:flex;align-items:center;gap:10px;font-size:22px;letter-spacing:.2px;font-weight:500}.mstripes{display:inline-flex;gap:2px;transform:skew(-22deg);margin-right:3px}.mstripes i{width:8px;height:21px;background:#6cc9ee}.mstripes i:nth-child(2){background:#154ca5}.mstripes i:nth-child(3){background:#ef3447}.home,.menuBtn{height:42px;min-width:46px;border:0;background:transparent;font-size:24px}.menuBtn{margin-left:auto;font-size:13px;letter-spacing:1.3px;color:#c9ccd2}.home svg{width:23px;height:23px;fill:white}.gameArea{flex:1;min-height:0;position:relative;overflow:hidden;background:#07568a}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:absolute;left:12px;top:12px;z-index:1;background:#090b0df0;border:2px solid #eee;border-radius:3px;padding:10px 13px;min-width:136px;font-family:monospace;pointer-events:none;text-shadow:2px 2px #000}.hud label{display:block;font-size:12px;font-weight:bold;letter-spacing:1px}.hud strong{display:block;font-size:25px;line-height:1.16;margin-bottom:8px;color:#f04b42}.hud strong.white{color:#fff}.hud strong:last-child{margin-bottom:0}.control{position:absolute;bottom:14px;z-index:2;width:76px;height:62px;border:1px solid #ffffff70;border-radius:10px;background:#080b10a8;font-size:29px;touch-action:manipulation}.left{left:14px}.right{right:14px}.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:#05070bcf;padding:12px}.hidden{display:none!important}.dialog{width:min(420px,90%);padding:22px 24px;text-align:center;background:linear-gradient(150deg,#242a33,#101318);border:1px solid #777b85;box-shadow:0 15px 55px #000b}.dialog h1{margin:0 0 10px;font-size:26px;letter-spacing:1.5px}.dialog p{color:#d1d4d8;line-height:1.45;font-size:14px}.dialog button,.menuPanel button{border:1px solid #757b85;background:#313842;padding:12px 24px;min-height:45px;font-weight:bold}.dialog button.primary{background:#9c2029;border-color:#e2434b}.menuPanel{position:absolute;right:10px;top:8px;z-index:5;background:#161a21;border:1px solid #666;padding:12px;display:grid;gap:8px;min-width:160px;box-shadow:0 12px 35px #0009}.notice{font-size:11px;color:#aeb3bd;margin-top:12px}@media(max-height:460px){.topbar{height:42px;min-height:42px;padding:0 12px}.brand{font-size:17px}.mstripes i{height:16px;width:6px}.home,.menuBtn{height:36px}.hud{top:7px;left:7px;padding:6px 9px;min-width:112px}.hud label{font-size:10px}.hud strong{font-size:18px;margin-bottom:5px}.control{height:45px;width:55px;bottom:8px}.dialog{padding:13px}.dialog h1{font-size:21px}.dialog p{font-size:12px;margin:8px 0}.dialog button{min-height:37px;padding:8px 16px}}@media(max-width:560px){.topbar{padding:0 10px;gap:7px}.brand{font-size:17px}.hud{min-width:105px;padding:7px}.hud label{font-size:10px}.hud strong{font-size:19px}.control{width:54px;height:50px}}
</style></head><body><div class="app"><header class="topbar"><button class="home" id="home" aria-label="Game home"><svg viewBox="0 0 24 24"><path d="M12 2 2 11h3v10h6v-7h3v7h6V11h3z"/></svg></button><div class="brand"><span class="mstripes"><i></i><i></i><i></i></span><span><b>M</b> Highway</span></div><button class="menuBtn" id="menuBtn">MENU ▾</button></header><main class="gameArea" id="area"><canvas id="game"></canvas><div class="hud"><label>HI-SCORE</label><strong id="best">000000</strong><label>SCORE</label><strong class="white" id="score">000000</strong><label>SPEED</label><strong class="white"><span id="speed">076</span><small style="font-size:12px"> MPH</small></strong></div><button class="control left" id="left" aria-label="Steer left">◀</button><button class="control right" id="right" aria-label="Steer right">▶</button><div class="menuPanel hidden" id="menuPanel"><button id="pause">PAUSE</button><button id="restart">NEW GAME</button><button id="closeMenu">CLOSE</button></div><div class="overlay" id="overlay"><div class="dialog"><h1 id="headline">M HIGHWAY</h1><p id="message">Pass traffic to score! Closer cuts earn more points. Tap arrows or swipe to steer.</p><button class="primary" id="start">START GAME</button><div class="notice">For use only while parked.</div></div></div></main></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),area=$('area'),overlay=$('overlay'),menu=$('menuPanel');let W=0,H=0,D=1,roadL=0,roadR=0,lane=1,px=0,cars=[],dist=0,score=0,speed=76,best=0,offset=0,spawn=0,last=0,state='menu',t=0,popups=[],lastPattern=-1;try{best=Number(localStorage.getItem('mhighway-best')||0)}catch(e){}const fmt=n=>String(Math.floor(n)).padStart(6,'0');$('best').textContent=fmt(best);function size(){let r=area.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(W*D));canvas.height=Math.max(1,Math.floor(H*D));ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;let roadWidth=Math.min(W*.58,Math.max(205,H*.88));roadL=(W-roadWidth)/2;roadR=roadL+roadWidth;px=center(lane)}function center(n){return roadL+(roadR-roadL)*(n+.5)/3}window.addEventListener('resize',size);size();function show(title,msg,action){$('headline').textContent=title;$('message').textContent=msg;$('start').textContent=action;overlay.classList.remove('hidden')}function start(){cars=[];popups=[];dist=0;score=0;speed=76;offset=0;spawn=1.1;lastPattern=-1;lane=1;px=center(lane);$('score').textContent=fmt(0);state='play';overlay.classList.add('hidden');menu.classList.add('hidden');last=performance.now()}function pause(){if(state==='play'){state='pause';show('PAUSED','Your highway run is paused.','RESUME')}else if(state==='pause'){state='play';overlay.classList.add('hidden');last=performance.now()}menu.classList.add('hidden')}$('start').onclick=()=>state==='pause'?pause():start();$('pause').onclick=pause;$('restart').onclick=start;$('menuBtn').onclick=()=>menu.classList.toggle('hidden');$('closeMenu').onclick=()=>menu.classList.add('hidden');$('home').onclick=()=>{if(state==='play'||state==='pause'){state='menu';show('M HIGHWAY','Ready for another run?','START GAME')}else show('M HIGHWAY','Pass traffic to earn points. Close cuts earn bonuses.','START GAME');menu.classList.add('hidden')};function steer(d){if(state==='play')lane=Math.max(0,Math.min(2,lane+d))}$('left').onclick=()=>steer(-1);$('right').onclick=()=>steer(1);let x0=0;canvas.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>24)steer(dx>0?1:-1)},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();steer(-1)}if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();steer(1)}if(e.key===' '||e.key==='Escape'){e.preventDefault();pause()}});function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}function palm(x,y,s,flip=1){ctx.save();ctx.translate(x,y);ctx.scale(flip*s,s);rect(-4,-5,9,55,'#533317');rect(-2,0,4,50,'#9a6527');for(let i=0;i<7;i++){let a=i*Math.PI*2/7,ex=Math.cos(a)*38,ey=Math.sin(a)*20-9;poly([[0,0],[ex*.45,ey-10],[ex,ey+6],[ex*.65,ey+10]],i%2?'#16752c':'#24a431');poly([[ex*.45,ey-10],[ex,ey+6],[ex*.8,ey+17]],'#0c5925')}ctx.restore()}function vehicle(x,y,color,s=1,player=false){let cw=Math.min((roadR-roadL)/3*.51,58)*s,ch=cw*1.65;ctx.save();ctx.translate(Math.round(x),Math.round(y));rect(-cw*.57,-ch*.34,cw*1.14,ch*.67,'#111');rect(-cw*.48,-ch*.5,cw*.96,ch,color);rect(-cw*.34,-ch*.24,cw*.68,ch*.27,'#122e42');rect(-cw*.34,ch*.15,cw*.68,ch*.16,'#183247');rect(-cw*.44,-ch*.43,cw*.17,5,'#f3f4dd');rect(cw*.27,-ch*.43,cw*.17,5,'#f3f4dd');rect(-cw*.44,ch*.42,cw*.17,5,'#e62d2d');rect(cw*.27,ch*.42,cw*.17,5,'#e62d2d');rect(-cw*.48,-ch*.1,5,ch*.3,'#111');rect(cw*.42,-ch*.1,5,ch*.3,'#111');if(player){rect(-cw*.1,-ch*.47,cw*.075,ch*.94,'#72c5e8');rect(-cw*.025,-ch*.47,cw*.075,ch*.94,'#154ca5');rect(cw*.05,-ch*.47,cw*.075,ch*.94,'#ed3044')}ctx.restore();return{cw,ch}}function scene(){rect(0,0,W,H,'#0877ae');let stripe=55,scroll=offset*.45;for(let y=-stripe+(scroll%stripe);y<H;y+=stripe){rect(0,y,W,3,'#199ac9');rect(8,y+19,Math.max(0,roadL-70),2,'#36b8d9');rect(roadR+70,y+31,Math.max(0,W-roadR-70),2,'#36b8d9')}let sand=Math.min(75,Math.max(24,W*.085));rect(roadL-sand,0,sand,H,'#e6a329');rect(roadR,0,sand,H,'#e6a329');for(let y=-110+(offset*.8%115);y<H+100;y+=115){palm(roadL-sand*.5,y,Math.min(1,sand/58));palm(roadR+sand*.5,y+53,Math.min(1,sand/58),-1)}rect(roadL-6,0,roadR-roadL+12,H,'#ece5d8');rect(roadL,0,roadR-roadL,H,'#394c52');for(let y=-44+(offset%64);y<H;y+=64){rect(roadL-6,y,6,28,'#d52a22');rect(roadR,y,6,28,'#d52a22')}rect(roadL+8,0,3,H,'#e7f4f3');rect(roadR-11,0,3,H,'#e7f4f3');for(let k=1;k<=2;k++){let x=roadL+(roadR-roadL)*k/3;for(let y=-90+(offset%95);y<H;y+=95)rect(x-3,y,6,43,'#e4f4f2')}for(let c of cars)vehicle(center(c.lane),c.y,c.color,c.s);vehicle(px,H*.76,'#f4f4ef',1.05,true)}function crash(){state='over';if(score>best){best=score;try{localStorage.setItem('mhighway-best',String(Math.floor(best)))}catch(e){}}$('best').textContent=fmt(best);show('GAME OVER',`Score: ${fmt(score)} • ${Math.floor(dist)} distance. Try to beat your best run!`,'TRY AGAIN')}function award(c){
  // Award a cut only after the opponent has completely passed the player.
  // The side-to-side distance at the closest approach determines the bonus.
  if(c.awarded)return;c.awarded=true;
  const laneW=(roadR-roadL)/3;
  const clearance=Math.abs(center(c.lane)-px)/laneW;
  let pts=100,label='CUT';
  if(clearance<.94){pts=300;label='CLOSE CUT'}
  else if(clearance<1.18){pts=200;label='CLEAN CUT'}
  score+=pts;
  popups.push({x:Math.min(W-95,px+40),y:H*.76-46,life:1.15,pts,label});
  $('score').textContent=fmt(score);
  if(score>best){best=score;$('best').textContent=fmt(best);try{localStorage.setItem('mhighway-best',String(Math.floor(best)))}catch(e){}}
}
function update(dt){
  if(state!=='play')return;
  t+=dt;dist+=speed*dt*.75;
  // Progressive difficulty with a capped speed and predictable, solvable patterns.
  const level=Math.min(12,Math.floor(score/1000));
  speed=Math.min(152,76+level*6.3);
  offset+=speed*dt*2.6;
  px+=(center(lane)-px)*Math.min(1,dt*15);
  spawn-=dt;
  if(spawn<=0){
    // Spawn waves of at most two cars; one lane ALWAYS remains free.
    // Each wave is separated far enough to change lanes at maximum speed.
    const blocked=Math.random()<Math.min(.62,.12+level*.045)?2:1;
    const free=Math.floor(Math.random()*3);
    let lanes=[0,1,2].filter(n=>n!==free);
    if(blocked===1)lanes=[lanes[Math.floor(Math.random()*lanes.length)]];
    const colors=['#e63b30','#f4c22e','#1e76d9','#a6bbc2','#30a66c'];
    for(const n of lanes)cars.push({lane:n,y:-90,color:colors[Math.floor(Math.random()*colors.length)],s:.88,awarded:false,closest:Infinity});
    // Gap measured in travel time; avoids impossible consecutive walls.
    spawn=Math.max(1.0,1.65-level*.045)+Math.random()*.25;
  }
  const playerY=H*.76;
  const laneW=(roadR-roadL)/3;
  const carH=Math.min(laneW*.51,58)*1.65;
  for(const c of cars){
    const prevY=c.y;
    c.y+=(speed+45)*dt*2.15;
    const dx=Math.abs(center(c.lane)-px);
    // Actual overlapping rectangles, with a small forgiveness margin.
    const collisionX=laneW*.48;
    const collisionY=carH*.85;
    if(Math.abs(c.y-playerY)<collisionY&&dx<collisionX){crash();break}
    // Only a successful overtake counts, not simply changing lanes.
    if(!c.awarded&&prevY<=playerY+carH&&c.y>playerY+carH){award(c)}
  }
  cars=cars.filter(c=>c.y<H+125);
  for(const p of popups){p.life-=dt;p.y-=dt*37}
  popups=popups.filter(p=>p.life>0);
  $('speed').textContent=String(Math.floor(speed)).padStart(3,'0');
}
function drawPopups(){
  ctx.save();ctx.textAlign='left';
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.life*2.3);
    const x=Math.max(8,Math.min(W-110,p.x));
    ctx.font='bold 18px monospace';ctx.lineWidth=4;ctx.strokeStyle='#06210c';
    ctx.strokeText('+'+p.pts,x,p.y);ctx.fillStyle='#53ff77';ctx.fillText('+'+p.pts,x,p.y);
    ctx.font='bold 10px monospace';ctx.strokeText(p.label,x,p.y+14);ctx.fillText(p.label,x,p.y+14);
  }
  ctx.restore();
}
function loop(now){let dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);scene();drawPopups();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
