      const gain=12+Math.min(7,score/1600);
      // Positive escape velocity makes the cop drift backward naturally.
      cop.gap+=dt*(cop.escapeVelocity-gain);
    }
    // Keep a physically plausible longitudinal buffer between units, even
    // while they're changing lanes. Smooth braking avoids sudden teleporting.
    const aheadUnits=activeFormation.filter(other=>other!==cop && other.gap<cop.gap);
    const nearestAhead=aheadUnits.sort((a,b)=>b.gap-a.gap)[0];
    const formationBuffer=carH*1.45+20;
    if(nearestAhead && cop.gap<nearestAhead.gap+formationBuffer){
      cop.gap+=(nearestAhead.gap+formationBuffer-cop.gap)*Math.min(1,dt*3.2);
    }
    cop.gap=Math.max(minGap,cop.gap);
    const copY=playerY+cop.gap;
    // Police choose their OWN safest route through traffic, rather than
    // mirroring the player's cuts. Look ahead and evaluate both adjacent lanes.
    const scan=(n)=>{
      const relevant=cars.filter(c=>c.lane===n);
      let forward=999,backward=999;
      for(const c of relevant){const dy=c.y-copY;
        if(dy<0)forward=Math.min(forward,-dy);
        else backward=Math.min(backward,dy);
      }
      // Treat other patrol cars as moving obstacles, not ghost vehicles.
      for(const other of activeFormation){
        if(other===cop)continue;
        const otherLane=Math.round((other.x-roadL)/laneW-.5);
        if(other.lane!==n && otherLane!==n)continue;
        const dy=(other.y||playerY+other.gap)-copY;
        if(dy<0)forward=Math.min(forward,Math.max(0,-dy-carH*.25));
        else backward=Math.min(backward,Math.max(0,dy-carH*.25));
      }
      return {forward,backward};
    };
    const current=scan(cop.lane);
    const blocked=current.forward<carH*2.7;
    if(blocked){cop.blockedTime+=dt;cop.gap+=dt*6;}
    else cop.blockedTime=Math.max(0,cop.blockedTime-dt*2);
    if(cop.reaction<=0){
      let chosen=cop.lane,best=-1e9;
      for(const n of [cop.lane-1,cop.lane,cop.lane+1]){
        if(n<0||n>2)continue;
        const g=scan(n),changing=n!==cop.lane;
        // No reckless cuts into another car's immediate footprint.
        if(changing&&(g.forward<carH*1.8+15||g.backward<carH*1.55+10))continue;
        const room=Math.min(320,g.forward);
        const scoreLane=room*.76-Math.abs(n-lane)*7+(n===cop.lane?10:0)
          -(blocked&&n===cop.lane?105:0);
        if(scoreLane>best){best=scoreLane;chosen=n;}
      }
      if(chosen!==cop.lane){cop.lane=chosen;cop.reaction=.30+Math.random()*.16;}
      else cop.reaction=.16+Math.random()*.12;
    }
    // When the player makes no difficult cuts, police slowly close in.
    // A blocked police lane slows the gain instead of forcing a crash.
    if(cop.state==='chase'&&!blocked)cop.gap-=dt*(5+cop.skill*5);
    // Smoothly animate across lanes; actual position is used for collisions.
    // Smooth independent lane transitions. A second patrol cannot merge
    // into an occupied slot, even if it chose the same opening.
    let targetX=center(cop.lane);
    for(const other of activeFormation){
      if(other===cop)continue;
      if(Math.abs((other.y||playerY+other.gap)-(playerY+cop.gap))<carH*1.35 &&
         Math.abs(other.x-targetX)<laneW*.48){
        targetX=cop.x;cop.reaction=Math.max(cop.reaction,.22);
        break;
      }
    }
    cop.x+=(targetX-cop.x)*Math.min(1,dt*(4.6+cop.skill*1.8));
    cop.y=playerY+cop.gap;
    // Police can crash if the gap unexpectedly closes, but aren't reckless.
    // Ignore collision checks while entering, and require substantial overlap.
    const hit=cop.state==='chase' && cop.life>1.8 && cars.find(c=>
      Math.abs(center(c.lane)-cop.x)<laneW*.19 &&
      Math.abs(c.y-cop.y)<carH*.38);
    // A crash requires sustained actual overlap, not a random collision
    // lottery on every animation frame.
    cop.collisionTime=hit?(cop.collisionTime||0)+dt:Math.max(0,(cop.collisionTime||0)-dt*3);
    if(cop.collisionTime>.24){
      cop.state='wrecked';explosion(cop.x,cop.y,true);
      patrolCooldown=Math.max(patrolCooldown,12+Math.random()*9);
      nextCop=Math.max(nextCop,patrolCooldown);continue;
    }
    if(cop.gap>H*.78+125 || cop.blockedTime>6.8){
      cop.state='lost';escapedCops++;
      patrolCooldown=Math.max(patrolCooldown,14+Math.random()*12);
      nextCop=Math.max(nextCop,patrolCooldown);
    }
  }
  cops=cops.filter(c=>c.state==='chase'||c.state==='approach'||(c.state==='lost'&&c.y<H+120));

  if(spawn<=0){
    // Traffic is arranged in reachable waves. Every row has an open lane,
    // and successive two-car rows never require an instant two-lane jump.
    // A one-car row between hard rows gives room for rewarding cut maneuvers.
    const laneW=(roadR-roadL)/3;
    const levelFactor=Math.min(1,level/12);
    const hardChance=.34+levelFactor*.42;
    const hard=Math.random()<hardChance && waveCount%3!==2;
    let free;
    const r=Math.random();
    // The guaranteed corridor changes by at most one lane per wave.
    // This prevents an impossible jump across two occupied lanes.
    const candidates=[openLane];
    if(openLane>0)candidates.push(openLane-1);
    if(openLane<2)candidates.push(openLane+1);
    free=candidates[Math.floor(Math.random()*candidates.length)];
    // Every fourth wave is a single car, leaving two escape routes.
    const blocked=(waveCount%4===3)?1:(hard?2:1);
    let lanes=[0,1,2].filter(n=>n!==free);
    if(blocked===1){
      // Put the car in a lane the player may need to cut away from.
      const preferred=(Math.random()<.58?openLane:lanes[Math.floor(Math.random()*lanes.length)]);
      lanes=[preferred===free?lanes[Math.floor(Math.random()*lanes.length)]:preferred];
    }
    const colors=['#e63b30','#f4c22e','#1e76d9','#a6bbc2','#30a66c','#f5f0e7'];
    // Each wave has its own traffic pace. Slower vehicles are caught sooner;
    // faster vehicles require more planning. Cars within one wave share pace
    // so they don't unpredictably overlap or close off the safe lane.
    const paceOptions=[0.82,0.92,1.00,1.10,1.18];
    const pace=paceOptions[Math.floor(Math.random()*paceOptions.length)];
    // Keep new cars upstream of existing traffic, but never stack them
    // so closely that the car-following correction freezes a vehicle.
    const spawnY=-Math.max(105,carH*1.8);
    for(const n of lanes){
      const sameLane=cars.filter(c=>c.lane===n);
      const nearest=sameLane.length?Math.min(...sameLane.map(c=>c.y)):Infinity;
      const y=Math.min(spawnY,nearest-carH*2.25);
      cars.push({uid:++trafficId,lane:n,y,color:colors[Math.floor(Math.random()*colors.length)],s:.88+Math.random()*.08,pace,actualPace:pace,awarded:false,minClearance:Infinity,moves:[]});
    }
    openLane=free;waveCount++;
    // At higher scores traffic is denser, but gaps scale with actual
    // road speed and car size so the player has time to steer safely.
    const travelSpeed=(speed+45)*2.15*1.22;
    const carHeight=Math.min(laneW*.51,58)*1.65;
    // Keep enough time between rows to steer into the open corridor.
    // Density increases with both score and survival time, with a safety floor.
    const safeGap=(carHeight*3.5)/travelSpeed+.52;
    spawn=Math.max(safeGap,1.48-level*.033)+Math.random()*.22;
    if(blocked===2 && free!==lastPattern)spawn+=.18;
    lastPattern=free;
    // Two-lane shifts need more room; keep the next row reachable.
    if(blocked===2 && Math.abs(free-lane)===2)spawn+=.24;
  }
  // Traffic keeps moving: match the speed of a slower car ahead smoothly,
  // with a strict positive speed floor. No position snapping or hard stops.
  const minFollowing=carH*1.8;
  for(let n=0;n<3;n++){
    const line=cars.filter(c=>c.lane===n).sort((a,b)=>b.y-a.y);
    for(let i=0;i<line.length;i++){
      const c=line[i],ahead=line[i-1];
      let target=c.pace;
      if(ahead){
        const gap=ahead.y-c.y;
        const aheadPace=ahead.actualPace||ahead.pace;
        if(gap<minFollowing*2.7)target=Math.min(target,aheadPace);
        // Prevent closing on a vehicle while maintaining visible motion.
        if(gap<minFollowing*1.3)target=Math.min(target,Math.max(.65,aheadPace*.94));
      }
      c.actualPace+=(Math.max(.65,target)-c.actualPace)*Math.min(1,dt*2.4);
      c.actualPace=Math.max(.65,c.actualPace);
    }
  }
  for(const c of cars){
    const prevY=c.y;
    c.y+=(speed+45)*dt*2.15*c.actualPace;
    const dx=Math.abs(center(c.lane)-px);
    // Actual overlapping rectangles, with a small forgiveness margin.
    const collisionX=laneW*.48;
    const collisionY=carH*.85;
    if(Math.abs(c.y-playerY)<collisionY){
      if(dx<collisionX){crash();break}
      // Clearance is measured between the actual car bodies, not lane centers.
      c.minClearance=Math.min(c.minClearance,dx-collisionX);
    }
    // Only a successful overtake counts, not simply changing lanes.
    if(!c.awarded&&prevY<=playerY+carH&&c.y>playerY+carH){award(c)}
  }
  cars=cars.filter(c=>c.y<H+125);
  for(const p of popups){p.life-=dt;p.y-=dt*37}
  popups=popups.filter(p=>p.life>0);
  $('pursuitLabel').textContent=cops.some(c=>c.state==='chase'||c.state==='approach')?'PURSUIT: '+cops.filter(c=>c.state==='chase'||c.state==='approach').length+' UNIT(S)':'PURSUIT: CLEAR';
  $('speed').textContent=String(Math.floor(speed)).padStart(3,'0');
}
function drawPopups(){
  ctx.save();ctx.textAlign='left';
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.life*2.1);
    const x=Math.max(8,Math.min(W-52,p.x));
    ctx.font='bold 13px monospace';
    ctx.fillStyle=p.color;ctx.fillText(typeof p.pts==='number'?'+'+p.pts:p.pts,x,p.y);

  }
  ctx.restore();
}
function loop(now){let dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);scene();drawPopups();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
