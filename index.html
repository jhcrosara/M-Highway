*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070d;color:#f5f8fc;font-family:Arial,Helvetica,sans-serif;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column}.bar{height:58px;flex:none;background:linear-gradient(#0b1420,#060a10);border-bottom:1px solid #26405a;display:flex;align-items:center;gap:11px;padding:0 13px}.m{display:flex;gap:3px;transform:skew(-18deg);margin-right:3px}.m i{display:block;width:8px;height:25px;background:#6ac4ed}.m i:nth-child(2){background:#1471b5}.m i:nth-child(3){background:#ec3154}.brand{font-size:21px;white-space:nowrap}.brand b{font-weight:900}.ver{margin-left:auto;font-size:10px;letter-spacing:1px;color:#91abc4;white-space:nowrap}button{color:white;cursor:pointer;font:inherit}.menu{background:#101d2a;border:1px solid #476987;border-radius:8px;padding:10px;font-size:12px}.scene{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:15px;left:16px;pointer-events:none;text-shadow:0 2px 9px #000}.score{font-size:clamp(25px,6vw,38px);font-weight:900;letter-spacing:3px;font-variant-numeric:tabular-nums}.best{margin-top:5px;font-size:13px;color:#b9c7d5;letter-spacing:1px}.best span{color:#eacb80}.gauge{position:absolute;right:13px;top:13px;width:116px;height:116px;border:2px solid #87b1d0;border-radius:50%;background:#050c15e8;box-shadow:0 0 0 5px #030b13a8,inset 0 0 24px #122a42;display:flex;align-items:center;justify-content:center;flex-direction:column}.gauge:before{content:"";position:absolute;inset:8px;border-radius:50%;border:9px solid #123a59;border-top-color:#3db4f0;border-left-color:#2080c3;transform:rotate(-28deg)}.gauge>*{position:relative}.gauge small{font-size:11px;letter-spacing:2px;color:#a2c5dc}.gauge strong{font-size:37px;line-height:1.1;font-variant-numeric:tabular-nums}.gauge em{font-style:normal;font-size:12px}.pursuit{position:absolute;right:13px;top:141px;border:1px solid #315773;back </style></head><body><div id="app"><header class="bar"><div class="m"><i></i><i></i><i></i></div><div class="brand"><b>M</b> Highway</div><span class="ver">V37 · NIGHT DRIVE</span><button class="menu" id="menu">MENU ▾</button></header><main class="scene" id="scene"><canvas id="game"></canvas><div class="hud"><div class="score" id="score">000000</div><div class="best"><span>🏆</span> <span id="best">000000</span></div></div><div class="gauge"><small>SPEED</small><strong id="speed">000</strong><em>MPH</em></div><div class="pursuit" id="pursuit">PURSUIT: CLEAR</div><div class="hint" id="hint">AVOID TRAFFIC · USE ◀ ▶ OR ARROW KEYS</div><div class="controls"><button class="steer" id="left" aria-label="Steer left">‹</button><button class="steer" id="right" aria-label="Steer right">›</button></div><div class="overlay" id="overlay"><div class="panel"><div class="m" style="justify-content:center;margin:0 auto 14px;width:max-content"><i></i><i></i><i></i></div><h2 id="title">M Highway</h2><p id="message">Brooklyn Grey X3 M40i. Night highway. Dodge traffic, build your score, and escape the pursuit.</p><button class="action" id="start">START DRIVE</button><button class="action secondary hidden" id="resume">RESUME</button><p class="small">Tap the arrows to change lanes · Keyboard ← →</p></div></div></main></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,dpr=1,last=0,run=false,started=false,dead=false,score=0,best=0,speed=0,world=0,spawn=0,carX=1,desired=1,traffic=[],particles=[],shake=0,near=0,pursuit=0,frame=0;try{best=+(localStorage.getItem('mhighway_v37_best')||0)}catch(e){}$('best').textContent=String(best).padStart(6,'0');const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),colors=['#b9c0c8','#29333e','#9e2837','#1a527a','#e7e6e2','#434a50','#657c83','#a39c88'];function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function poly(pts,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}function line(x,y,X,Y,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function horizon(){return H*.35}function project(x,z){let depth=clamp(z,0,1),p=Math.pow(depth,1.45),hy=horizon(),y=hy+(H-hy)*p;let half=W*(.09+1.04*p);return{x:W/2+(x-1)*half/1.53,y,scale:.12+1.65*p,half,p}}function roadEdges(z){let p=project(1,z);return{left:W/2-p.half,right:W/2+p.half,y:p.y,p:p.p}}function drawBackground(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#040b17');sky.addColorStop(.36,'#132a42');sky.addColorStop(.65,'#101d26');sky.addColorStop(1,'#071016');rect(0,0,W,H,sky);let hy=horizon();for(let i=0;i<60;i++){let x=((i*139.37)%1000)/1000*W,y=((i*73.13)%400)/400*hy*.8;rect(x,y,i%8===0?2:1,1,'#7791a1')}let glow=ctx.createRadialGradient(W*.74,hy*.72,3,W*.74,hy*.72,W*.5);glow.addColorStop(0,'#203d5480');glow.addColorStop(1,'#12253a00');rect(0,0,W,hy,glow);for(let i=0;i<33;i++){let x=i*W/32,hh=15+(Math.sin(i*12.7)+1)*19+(i%5)*7;rect(x,hy-hh,W/31+2,hh,'#081521');if(i%3===0){rect(x+5,hy-hh+9,3,2,'#446175')}}rect(0,hy,W,H-hy,'#0a1b1b')}
function drawRoad(){let hy=horizon();let top=roadEdges(0),bot=roadEdges(1);poly([[top.left,hy],[top.right,hy],[bot.right,H],[bot.left,H]],'#222a32');let g=ctx.createLinearGradient(0,hy,0,H);g.addColorStop(0,'#26313a');g.addColorStop(.7,'#252a32');g.addColorStop(1,'#1b222a');poly([[top.left,hy],[top.right,hy],[bot.right,H],[bot.left,H]],g);for(let side of [-1,1]){let a=project(1,0),b=project(1,1);poly([[W/2+side*a.half,hy],[W/2+side*(a.half+2),hy],[W/2+side*(b.half+13),H],[W/2+side*b.half,H]],'#a3a9a8')}let travel=world%1;for(let i=0;i<28;i++){let z=(i+travel)/28;if(z>=1)continue;let z2=Math.min(1,z+.012+z*.018);let a=project(1,z),b=project(1,z2);let w=2+7*a.p;for(let boundary of [-1/3,1/3]){let x1=W/2+boundary*a.half,x2=W/2+boundary*b.half;poly([[x1-w/2,a.y],[x1+w/2,a.y],[x2+w/2,b.y],[x2-w/2,b.y]],'#d8dfe0')}}for(let i=0;i<19;i++){let z=((i/19+world*.065)%1);let a=project(1,z);let size=2+5*a.p;for(let side of [-1,1]){let x=W/2+side*(a.half+16+24*a.p),y=a.y;line(x,y,x,y-14*a.scale,'#304b43',Math.max(1,2*a.scale));ctx.fillStyle='#24594e';ctx.beginPath();ctx.ellipse(x,y-14*a.scale,6*a.scale,3*a.scale,0,0,Math.PI*2);ctx.fill();if(i%4===0){let lx=W/2+side*(a.half+40+55*a.p);line(lx,y,lx,y-54*a.scale,'#5d6668',Math.max(1,a.scale*2));ctx.fillStyle='#ffe5a2';ctx.beginPath();ctx.arc(lx-side*5*a.scale,y-54*a.scale,2.7*a.scale,0,7);ctx.fill()}}}let sheen=ctx.createLinearGradient(W*.4,hy,W*.55,H);sheen.addColorStop(0,'#7ca0b007');sheen.addColorStop(.5,'#93bad50d');sheen.addColorStop(1,'#1e253000');poly([[W*.47,hy],[W*.53,hy],[W*.78,H],[W*.22,H]],sheen)}
function drawCar(x,z,color,type='sedan',player=false){let p=project(x,z),s=player?Math.min(W*.30,155):Math.min(W*.29,87)*(.23+p.p*1.15);let w=player?s:s*(type==='truck'?1.05:1),h=w*(type==='truck'?1.35:type==='suv'?1.02:.83),cx=player?W/2+(carX-1)*Math.min(W*.25,110):p.x,cy=player?H*.84:p.y; if(!player&&z<.025)return;ctx.save();ctx.translate(cx,cy);if(player)ctx.rotate((desired-carX)*-.035);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,1,w*.6,h*.13,0,0,7);ctx.fill();let top=-h,body=color;poly([[-w*.44,-h*.80],[-w*.38,-h*.98],[w*.38,-h*.98],[w*.44,-h*.80],[w*.49,-h*.18],[w*.45,0],[-w*.45,0],[-w*.49,-h*.18]],body);poly([[-w*.36,-h*.84],[-w*.30,-h*.96],[w*.30,-h*.96],[w*.36,-h*.84]],'#6f7980');poly([[-w*.37,-h*.77],[w*.37,-h*.77],[w*.35,-h*.44],[-w*.35,-h*.44]],'#0a1c2a');poly([[-w*.32,-h*.73],[w*.32,-h*.73],[w*.29,-h*.51],[-w*.29,-h*.51]],'#1c3544');line(-w*.32,-h*.73,w*.32,-h*.73,'#688294',Math.max(1,w*.013));rect(-w*.43,-h*.38,w*.86,h*.16,player?'#56616a':'#2d343b');poly([[-w*.44,-h*.26],[-w*.07,-h*.26],[-w*.09,-h*.18],[-w*.45,-h*.17]],'#ff2937');poly([[w*.44,-h*.26],[w*.07,-h*.26],[w*.09,-h*.18],[w*.45,-h*.17]],'#ff2937');rect(-w*.38,-h*.245,w*.23,Math.max(1,w*.024),'#ff9293');rect(w*.15,-h*.245,w*.23,Math.max(1,w*.024),'#ff9293');round(-w*.17,-h*.28,w*.34,h*.105,2,'#0a111b');if(w>45){ctx.fillStyle='#f3f6f9';ctx.font=`bold ${Math.max(5,w*.075)}px Arial`;ctx.textAlign='center';ctx.fillText(player?'M':type==='truck'?'TRUCK':'',0,-h*.205)}rect(-w*.47,-h*.11,w*.94,h*.1,'#101820');if(player){round(-w*.34,-h*.095,w*.22,h*.045,2,'#9ea5a8');round(w*.12,-h*.095,w*.22,h*.045,2,'#9ea5a8');ctx.fillStyle='#c4d0d7';ctx.beginPath();ctx.arc(0,-h*.36,w*.047,0,7);ctx.fill();ctx.fillStyle='#2579bc';ctx.beginPath();ctx.arc(0,-h*.36,w*.031,0,7);ctx.fill();ctx.fillStyle='#e4ebf2';ctx.font=`bold ${w*.1}px Arial`;ctx.fillText('X3',-w*.29,-h*.34);ctx.fillText('M40i',w*.29,-h*.34)}ctx.restore()}
function update(dt){if(!run)return;speed=Math.min(132,speed+dt*29);world+=dt*(.55+speed*.035);carX+=(desired-carX)*Math.min(1,dt*8);score+=dt*speed*.68;spawn-=dt;let interval=clamp(1.45-speed*.006,.55,1.15);if(spawn<=0){spawn=interval*rand(.75,1.4);let lane=Math.floor(rand(0,3)),x=lane;let blocked=traffic.some(t=>t.lane===lane&&t.z<.23);if(!blocked)traffic.push({lane,x,z:0,type:Math.random()<.12?'truck':Math.random()<.48?'suv':'sedan',color:colors[Math.floor(rand(0,colors.length))],v:rand(.23,.39),passed:false})}for(let t of traffic){t.z+=dt*(.09+speed*.006-t.v*.18);if(!t.passed&&t.z>.91){t.passed=true;if(Math.abs(carX-t.x)>.59){score+=100;near=1}}if(t.z>.81&&t.z<1.04&&Math.abs(carX-t.x)<.52){crash();break}}traffic=traffic.filter(t=>t.z<1.3);near=Math.max(0,near-dt);if(score>best){best=Math.floor(score);$('best').textContent=String(best).padStart(6,'0');try{localStorage.setItem('mhighway_v37_best',best)}catch(e){}}$('score').textContent=String(Math.floor(score)).padStart(6,'0');$('speed').textContent=String(Math.round(speed)).padStart(3,'0')}
function render(){drawBackground();drawRoad();traffic.sort((a,b)=>a.z-b.z);for(let t of traffic)drawCar(t.x,t.z,t.color,t.type);drawCar(carX,1,'#777f84','suv',true);if(near>0){ctx.textAlign='center';ctx.fillStyle=`rgba(121,203,255,${near})`;ctx.font='bold 16px Arial';ctx.fillText('NEAR MISS +100',W/2,H*.57)}if(dead){rect(0,0,W,H,'#a3131918')}}function loop(t){let dt=clamp((t-last)/1000||0,0,.05);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);function show(title,message,button){run=false;$('overlay').classList.remove('hidden');$('title').textContent=title;$('message').textContent=message;$('start').textContent=button;$('resume').classList.toggle('hidden',!started||dead)}function start(){score=0;speed=38;world=0;spawn=.8;carX=1;desired=1;traffic=[];dead=false;started=true;run=true;$('overlay').classList.add('hidden');$('hint').style.display='none'}function crash(){if(dead)return;dead=true;run=false;show('CRASHED',`Score ${Math.floor(score).toLocaleString()} · Best ${best.toLocaleString()}`,'TRY AGAIN')}function steer(n){if(!run)return;desired=clamp(desired+n,0,2)}$('start').onclick=start;$('resume').onclick=()=>{run=true;$('overlay').classList.add('hidden')};$('menu').onclick=()=>show('PAUSED','Take a break or restart the highway drive.','NEW GAME');$('left').addEventListener('pointerdown',e=>{e.preventDefault();steer(-1)});$('right').addEventListener('pointerdown',e=>{e.preventDefault();steer(1)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){e.preventDefault();if(!e.repeat)steer(-1)}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){e.preventDefault();if(!e.repeat)steer(1)}if(e.key===' '){e.preventDefault();if(!started||dead)start()}});let touchStart=null;canvas.addEventListener('touchstart',e=>{touchStart=e.touches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{if(touchStart!==null){let d=e.changedTouches[0].clientX-touchStart;if(Math.abs(d)>28)steer(d>0?1:-1);touchStart=null}},{passive:true});})();
