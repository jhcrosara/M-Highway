</style></head><body><div class="app"><header class="topbar"><button class="home" id="home" aria-label="Game home"><svg viewBox="0 0 24 24"><path d="M12 2 2 11h3v10h6v-7h3v7h6V11h3z"/></svg></button><div class="brand"><span class="mstripes"><i></i><i></i><i></i></span><span><b>M</b> Highway</span></div><button class="menuBtn" id="menuBtn">V14 · MENU ▾</button></header><main class="gameArea" id="area"><canvas id="game"></canvas><div class="hud"><label>HI-SCORE</label><strong id="best">000000</strong><label>SCORE</label><strong class="white" id="score">000000</strong><label id="pursuitLabel">PURSUIT: CLEAR</label><label>SPEED</label><strong class="white"><span id="speed">076</span><small style="font-size:12px"> MPH</small></strong></div><button class="control left" id="left" aria-label="Steer left">◀</button><button class="control right" id="right" aria-label="Steer right">▶</button><div class="menuPanel hidden" id="menuPanel"><button id="pause">PAUSE</button><button id="restart">NEW GAME</button><button id="closeMenu">CLOSE</button></div><div class="overlay" id="overlay"><div class="dialog"><h1 id="headline">M HIGHWAY</h1><p id="message">Outrun pursuing police! Tight cuts can shake them off, but more patrols return as your score climbs. Tap arrows or swipe to steer.</p><button class="primary" id="start">START GAME</button><div class="notice">For use only while parked.</div></div></div></main></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),area=$('area'),overlay=$('overlay'),menu=$('menuPanel');let W=0,H=0,D=1,roadL=0,roadR=0,lane=1,px=0,cars=[],dist=0,score=0,speed=76,best=0,offset=0,spawn=0,last=0,state='menu',t=0,popups=[],lastPattern=-1,openLane=1,waveCount=0,cops=[],nextCop=9,escapedCops=0,copId=0;try{best=Number(localStorage.getItem('mhighway-best')||0)}catch(e){}const fmt=n=>String(Math.floor(n)).padStart(6,'0');$('best').textContent=fmt(best);function size(){let r=area.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(W*D));canvas.height=Math.max(1,Math.floor(H*D));ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;let roadWidth=Math.min(W*.58,Math.max(205,H*.88));roadL=(W-roadWidth)/2;roadR=roadL+roadWidth;px=center(lane)}function center(n){return roadL+(roadR-roadL)*(n+.5)/3}window.addEventListener('resize',size);size();function show(title,msg,action){$('headline').textContent=title;$('message').textContent=msg;$('start').textContent=action;overlay.classList.remove('hidden')}function start(){cars=[];popups=[];dist=0;score=0;speed=76;offset=0;t=0;spawn=.95;lastPattern=-1;openLane=1;waveCount=0;cops=[];nextCop=8;escapedCops=0;copId=0;lane=1;px=center(lane);$('score').textContent=fmt(0);$('pursuitLabel').textContent='PURSUIT: CLEAR';state='play';overlay.classList.add('hidden');menu.classList.add('hidden');last=performance.now()}function pause(){if(state==='play'){state='pause';show('PAUSED','Your highway run is paused.','RESUME')}else if(state==='pause'){state='play';overlay.classList.add('hidden');last=performance.now()}menu.classList.add('hidden')}$('start').onclick=()=>state==='pause'?pause():start();$('pause').onclick=pause;$('restart').onclick=start;$('menuBtn').onclick=()=>menu.classList.toggle('hidden');$('closeMenu').onclick=()=>menu.classList.add('hidden');$('home').onclick=()=>{if(state==='play'||state==='pause'){state='menu';show('M HIGHWAY','Ready for another run?','START GAME')}else show('M HIGHWAY','Pass traffic for points. Only skilled close cuts show green bonuses.','START GAME');menu.classList.add('hidden')};function steer(d){
  if(state!=='play')return;
  const next=Math.max(0,Math.min(2,lane+d));
  if(next===lane)return;
  const playerY=H*.76, oldLane=lane;
  // Capture lane changes near approaching traffic, including the time needed
  // for a two-step, three-lane maneuver.
  for(const c of cars){
    const dy=playerY-c.y;
    if(!c.awarded && dy>=-15 && dy<=260){
      c.moves.push({from:oldLane,to:next,time:t,dy});
    }
  }
  lane=next;
  // Pursuers react to the same lane changes as the player, but cannot
  // instantly copy sharp weaving through traffic.
  for(const cop of cops){
    if(cop.state!=='chase')continue;
    cop.target=next;
    cop.reaction=Math.max(cop.reaction,.28);
  }
}$('left').onclick=()=>steer(-1);$('right').onclick=()=>steer(1);let x0=0;canvas.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>24)steer(dx>0?1:-1)},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();steer(-1)}if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();steer(1)}if(e.key===' '||e.key==='Escape'){e.preventDefault();pause()}});function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}function palm(x,y,s,flip=1){ctx.save();ctx.translate(x,y);ctx.scale(flip*s,s);rect(-4,-5,9,55,'#533317');rect(-2,0,4,50,'#9a6527');for(let i=0;i<7;i++){let a=i*Math.PI*2/7,ex=Math.cos(a)*38,ey=Math.sin(a)*20-9;poly([[0,0],[ex*.45,ey-10],[ex,ey+6],[ex*.65,ey+10]],i%2?'#16752c':'#24a431');poly([[ex*.45,ey-10],[ex,ey+6],[ex*.8,ey+17]],'#0c5925')}ctx.restore()}function vehicle(x,y,color,s=1,player=false){let cw=Math.min((roadR-roadL)/3*.51,58)*s,ch=cw*1.65;ctx.save();ctx.translate(Math.round(x),Math.round(y));rect(-cw*.57,-ch*.34,cw*1.14,ch*.67,'#111');rect(-cw*.48,-ch*.5,cw*.96,ch,color);rect(-cw*.34,-ch*.24,cw*.68,ch*.27,'#122e42');rect(-cw*.34,ch*.15,cw*.68,ch*.16,'#183247');rect(-cw*.44,-ch*.43,cw*.17,5,'#f3f4dd');rect(cw*.27,-ch*.43,cw*.17,5,'#f3f4dd');rect(-cw*.44,ch*.42,cw*.17,5,'#e62d2d');rect(cw*.27,ch*.42,cw*.17,5,'#e62d2d');rect(-cw*.48,-ch*.1,5,ch*.3,'#111');rect(cw*.42,-ch*.1,5,ch*.3,'#111');if(player){rect(-cw*.1,-ch*.47,cw*.075,ch*.94,'#72c5e8');rect(-cw*.025,-ch*.47,cw*.075,ch*.94,'#154ca5');rect(cw*.05,-ch*.47,cw*.075,ch*.94,'#ed3044')}ctx.restore();return{cw,ch}}function policeVehicle(x,y,s=1){
  vehicle(x,y,'#e8edf4',s,false);
  const w=Math.min((roadR-roadL)/3*.51,58)*s;
  rect(x-w*.35,y-6,w*.34,7,'#e42a34');
  rect(x+w*.01,y-6,w*.34,7,'#1a66f1');
  rect(x-w*.16,y+11,w*.32,5,'#1b2435');
}
function scene(){rect(0,0,W,H,'#0877ae');let stripe=55,scroll=offset*.45;for(let y=-stripe+(scroll%stripe);y<H;y+=stripe){rect(0,y,W,3,'#199ac9');rect(8,y+19,Math.max(0,roadL-70),2,'#36b8d9');rect(roadR+70,y+31,Math.max(0,W-roadR-70),2,'#36b8d9')}let sand=Math.min(75,Math.max(24,W*.085));rect(roadL-sand,0,sand,H,'#e6a329');rect(roadR,0,sand,H,'#e6a329');for(let y=-110+(offset*.8%115);y<H+100;y+=115){palm(roadL-sand*.5,y,Math.min(1,sand/58));palm(roadR+sand*.5,y+53,Math.min(1,sand/58),-1)}rect(roadL-6,0,roadR-roadL+12,H,'#ece5d8');rect(roadL,0,roadR-roadL,H,'#394c52');for(let y=-44+(offset%64);y<H;y+=64){rect(roadL-6,y,6,28,'#d52a22');rect(roadR,y,6,28,'#d52a22')}rect(roadL+8,0,3,H,'#e7f4f3');rect(roadR-11,0,3,H,'#e7f4f3');for(let k=1;k<=2;k++){let x=roadL+(roadR-roadL)*k/3;for(let y=-90+(offset%95);y<H;y+=95)rect(x-3,y,6,43,'#e4f4f2')}for(let c of cars)vehicle(center(c.lane),c.y,c.color,c.s);for(const cop of cops)policeVehicle(cop.x,cop.y,.94);vehicle(px,H*.76,'#f4f4ef',1.05,true)}function crash(){state='over';if(score>best){best=score;try{localStorage.setItem('mhighway-best',String(Math.floor(best)))}catch(e){}}$('best').textContent=fmt(best);show('GAME OVER',`Score: ${fmt(score)} • ${Math.floor(dist)} distance. Try to beat your best run!`,'TRY AGAIN')}function award(c){
  if(c.awarded)return;
  c.awarded=true;
  // Ordinary overtakes count quietly. No green popup unless the player
  // deliberately cuts around traffic with genuinely tight clearance.
  let pts=50,flash=false;
  // Evaluate the player's actual lane changes near this car. A plain
  // adjacent-lane overtake never creates a popup.
  const recent=c.moves.filter(m=>t-m.time<=3.2 && m.dy>=-15 && m.dy<=260);
  // A tight cut means the player escaped the occupied lane shortly before
  // the car reached them, or moved into an adjacent lane at close range.
  // Smaller forward clearance at the moment of the lane change earns
  // the higher bonus. Three-lane tight cuts take priority.
  const closeMoves=recent.filter(m=>m.dy>=0 && m.dy<=210 &&
      (m.from===c.lane || m.to===c.lane));
  if(closeMoves.length){
    const nearest=Math.min(...closeMoves.map(m=>m.dy));
    pts=nearest<=125?200:150;
    flash=true;
    for(let i=0;i<recent.length;i++)for(let j=i+1;j<recent.length;j++){
      if(recent[j].time-recent[i].time<=1.8 &&
         recent[i].to===recent[j].from &&
         Math.abs(recent[j].to-recent[i].from)===2){pts=350}
    }
  }
  // Only skillful close cuts disrupt an active pursuit. The harder the
  // maneuver, the more distance it creates; ordinary passes do not help.
  if(flash){
    for(const cop of cops){
      if(cop.state!=='chase')continue;
      cop.gap+=pts===350?125:pts===200?88:60;
      cop.reaction+=pts===350?1.35:pts===200?.95:.65;
      cop.stagger=Math.max(cop.stagger,pts===350?1.2:.7);
    }
  }
  score+=pts;
  if(flash)popups.push({x:Math.min(W-50,px+24),y:H*.76-38,life:1.05,pts,color:pts===350?'#4c00b0':'#008000'});
  $('score').textContent=fmt(score);
  if(score>best){best=score;$('best').textContent=fmt(best);try{localStorage.setItem('mhighway-best',String(Math.floor(best)))}catch(e){}}
}
function update(dt){
  if(state!=='play')return;
  t+=dt;dist+=speed*dt*.75;
  // Progressive difficulty with capped speed and reachable traffic patterns.
  const level=Math.min(12,Math.floor(score/850));
  speed=Math.min(152,76+level*6.3);
  offset+=speed*dt*2.6;
  px+=(center(lane)-px)*Math.min(1,dt*15);
  spawn-=dt;
  // New police units join the pursuit periodically. Active units have a
  // cap so the screen stays readable, and every pursuit can be escaped.
  nextCop-=dt;
  if(nextCop<=0){
    if(cops.filter(c=>c.state==='chase').length<Math.min(3,1+Math.floor(score/2400))){
      const id=++copId;
      cops.push({id,lane:lane,x:center(lane),target:lane,y:H+85,
        gap:185,reaction:.8,stagger:0,state:'chase',life:0});
    }
    nextCop=Math.max(7.5,15-Math.floor(score/1700)*.7)+Math.random()*5;
  }
  const playerY=H*.76;
  const laneW=(roadR-roadL)/3;
  const carH=Math.min(laneW*.51,58)*1.65;
  // Police stay behind the player, visually closing in when driving in a
  // straight line. Tight cuts build a gap; a large gap loses the pursuer.
  for(const cop of cops){
    cop.life+=dt;
    if(cop.state==='lost'){cop.y+=dt*185;continue}
    cop.reaction=Math.max(0,cop.reaction-dt);
    cop.stagger=Math.max(0,cop.stagger-dt);
    if(cop.reaction===0){
      cop.lane=cop.target;
      cop.reaction=.3;
    }
    cop.x+=(center(cop.lane)-cop.x)*Math.min(1,dt*4.8);
    cop.gap-=dt*(cop.stagger>0?1.5:10+Math.min(7,score/1100));
    // Never create an unavoidable police collision or game-over state.
    cop.gap=Math.max(78,cop.gap);
    cop.y=playerY+cop.gap;
    if(cop.gap>H*.85+110){
      cop.state='lost';escapedCops++;
      popups.push({x:Math.min(W-90,px+26),y:playerY-62,life:1.3,pts:'ESCAPED',color:'#72c5e8'});
    }
  }
  cops=cops.filter(c=>c.state==='chase'||c.y<H+120);

  if(spawn<=0){
    // Traffic is arranged in reachable waves. Every row has an open lane,
    // and successive two-car rows never require an instant two-lane jump.
    // A one-car row between hard rows gives room for rewarding cut maneuvers.
    const laneW=(roadR-roadL)/3;
    const levelFactor=Math.min(1,level/12);
    const hardChance=.28+levelFactor*.44;
    const hard=Math.random()<hardChance && waveCount%3!==2;
    let free;
    const r=Math.random();
    if(r<.25)free=openLane;
    else if(r<.625)free=Math.max(0,openLane-1);
    else free=Math.min(2,openLane+1);
    // Every fourth wave is a single car, leaving two escape routes.
    const blocked=(waveCount%4===3)?1:(hard?2:1);
    let lanes=[0,1,2].filter(n=>n!==free);
    if(blocked===1){
      // Put the car in a lane the player may need to cut away from.
      const preferred=(Math.random()<.58?openLane:lanes[Math.floor(Math.random()*lanes.length)]);
      lanes=[preferred===free?lanes[Math.floor(Math.random()*lanes.length)]:preferred];
    }
    const colors=['#e63b30','#f4c22e','#1e76d9','#a6bbc2','#30a66c','#f5f0e7'];
    // Each wave has its own traffic pace. Slower vehicles are caught sooner;
    // faster vehicles require more planning. Cars within one wave share pace
    // so they don't unpredictably overlap or close off the safe lane.
    const paceOptions=[0.78,0.88,1.00,1.12,1.22];
    const pace=paceOptions[Math.floor(Math.random()*paceOptions.length)];
    for(const n of lanes)cars.push({lane:n,y:-100,color:colors[Math.floor(Math.random()*colors.length)],s:.88+Math.random()*.08,pace,awarded:false,minClearance:Infinity,moves:[]});
    openLane=free;waveCount++;
    // At higher scores traffic is denser, but gaps scale with actual
    // road speed and car size so the player has time to steer safely.
    const travelSpeed=(speed+45)*2.15*1.22;
    const carHeight=Math.min(laneW*.51,58)*1.65;
    const safeGap=(carHeight*3.0)/travelSpeed+.44;
    spawn=Math.max(safeGap,1.37-level*.030)+Math.random()*.19;
    // Two-lane shifts need more room; keep the next row reachable.
    if(blocked===2 && Math.abs(free-lane)===2)spawn+=.24;
  }
  for(const c of cars){
    const prevY=c.y;
    c.y+=(speed+45)*dt*2.15*c.pace;
    const dx=Math.abs(center(c.lane)-px);
    // Actual overlapping rectangles, with a small forgiveness margin.
    const collisionX=laneW*.48;
    const collisionY=carH*.85;
    if(Math.abs(c.y-playerY)<collisionY){
      if(dx<collisionX){crash();break}
      // Clearance is measured between the actual car bodies, not lane centers.
      c.minClearance=Math.min(c.minClearance,dx-collisionX);
    }
    // Only a successful overtake counts, not simply changing lanes.
    if(!c.awarded&&prevY<=playerY+carH&&c.y>playerY+carH){award(c)}
  }
  cars=cars.filter(c=>c.y<H+125);
  for(const p of popups){p.life-=dt;p.y-=dt*37}
  popups=popups.filter(p=>p.life>0);
  $('pursuitLabel').textContent=cops.some(c=>c.state==='chase')?'PURSUIT: '+cops.filter(c=>c.state==='chase').length+' UNIT(S)':'PURSUIT: CLEAR';

}
function drawPopups(){
  ctx.save();ctx.textAlign='left';
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.life*2.1);
    const x=Math.max(8,Math.min(W-52,p.x));
    ctx.font='bold 13px monospace';
    ctx.fillStyle=p.color;ctx.fillText(typeof p.pts==='number'?'+'+p.pts:p.pts,x,p.y);

  }
  ctx.restore();
}
function loop(now){let dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);scene();drawPopups();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
